openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: API para criação, atualização, listagem e filtragem de tarefas.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /tasks:
    get:
      summary: Listar tarefas com filtros opcionais
      description: |
        Regras de filtro por data:
        - `date` e `dateType` devem ser enviados juntos.
        - `dateType=prevista` aplica o filtro em `dataPrevistaConclusao`.
        - `dateType=real` aplica o filtro em `dataConclusaoReal`.
        - Enviar apenas um dos campos (`date` ou `dateType`) deve retornar 400.
      parameters:
        - in: query
          name: priority
          schema:
            $ref: '#/components/schemas/TaskPriority'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - in: query
          name: date
          schema:
            type: string
            format: date
            description: Data usada no filtro (YYYY-MM-DD). Requer `dateType`.
        - in: query
          name: dateType
          schema:
            type: string
            enum: [prevista, real]
            description: Define qual data deve ser filtrada (`dataPrevistaConclusao` ou `dataConclusaoReal`). Requer `date`.
      responses:
        '200':
          description: Lista de tarefas retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '400':
          description: Filtros inválidos (inclui uso parcial de `date`/`dateType`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Criar nova tarefa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Tarefa criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}:
    get:
      summary: Obter tarefa por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tarefa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Tarefa não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Atualizar tarefa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Tarefa atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tarefa não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remover tarefa
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Tarefa removida
        '404':
          description: Tarefa não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed]
      description: |
        Mapeamento de domínio:
        - pending = pendente
        - in_progress = em andamento
        - completed = concluída

    TaskPriority:
      type: string
      enum: [low, medium, high]

    Task:
      type: object
      required:
        - id
        - title
        - description
        - priority
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        dataPrevistaConclusao:
          type: string
          format: date
          nullable: true
        dataConclusaoReal:
          type: string
          format: date-time
          nullable: true
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTaskRequest:
      type: object
      required:
        - title
        - description
        - priority
        - status
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        dataPrevistaConclusao:
          type: string
          format: date
          nullable: true
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        dataPrevistaConclusao:
          type: string
          format: date
          nullable: true
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
